pipelineInfo:
  name: news-authentication-pipeline
root:
  dag:
    tasks:
      DataCleaner:
        cachingOptions:
          enableCache: true
        componentRef:
          name: DataCleaner
        dependentTasks:
        - FeatureEngineeringComponent
        inputs:
          artifacts:
            feature_engineered_examples:
              taskOutputArtifact:
                outputArtifactKey: feature_engineered_examples
                producerTask: FeatureEngineeringComponent
        taskInfo:
          name: DataCleaner
      Evaluator:
        cachingOptions:
          enableCache: true
        componentRef:
          name: Evaluator
        dependentTasks:
        - DataCleaner
        - Trainer
        inputs:
          artifacts:
            examples:
              taskOutputArtifact:
                outputArtifactKey: preprocessed_examples
                producerTask: DataCleaner
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: Trainer
          parameters:
            eval_config:
              runtimeValue:
                constantValue:
                  stringValue: "{\n  \"metrics_specs\": [\n    {\n      \"metrics\"\
                    : [\n        {\n          \"class_name\": \"BinaryAccuracy\",\n\
                    \          \"threshold\": {\n            \"change_threshold\"\
                    : {\n              \"absolute\": 0.02,\n              \"direction\"\
                    : \"HIGHER_IS_BETTER\"\n            },\n            \"value_threshold\"\
                    : {\n              \"lower_bound\": 0.9\n            }\n     \
                    \     }\n        },\n        {\n          \"class_name\": \"Precision\"\
                    ,\n          \"threshold\": {\n            \"change_threshold\"\
                    : {\n              \"absolute\": 0.01,\n              \"direction\"\
                    : \"HIGHER_IS_BETTER\"\n            },\n            \"value_threshold\"\
                    : {\n              \"lower_bound\": 0.8\n            }\n     \
                    \     }\n        },\n        {\n          \"class_name\": \"Recall\"\
                    ,\n          \"threshold\": {\n            \"change_threshold\"\
                    : {\n              \"absolute\": 0.01,\n              \"direction\"\
                    : \"HIGHER_IS_BETTER\"\n            },\n            \"value_threshold\"\
                    : {\n              \"lower_bound\": 0.8\n            }\n     \
                    \     }\n        },\n        {\n          \"class_name\": \"AUC\"\
                    ,\n          \"threshold\": {\n            \"change_threshold\"\
                    : {\n              \"absolute\": 0.01,\n              \"direction\"\
                    : \"HIGHER_IS_BETTER\"\n            },\n            \"value_threshold\"\
                    : {\n              \"lower_bound\": 0.75\n            }\n    \
                    \      }\n        }\n      ]\n    }\n  ],\n  \"model_specs\":\
                    \ [\n    {\n      \"label_key\": \"label\"\n    }\n  ],\n  \"\
                    slicing_specs\": [\n    {}\n  ]\n}"
            example_splits:
              runtimeValue:
                constantValue:
                  stringValue: '["test"]'
            fairness_indicator_thresholds:
              runtimeValue:
                constantValue:
                  stringValue: 'null'
        taskInfo:
          name: Evaluator
      ExampleValidator:
        cachingOptions:
          enableCache: true
        componentRef:
          name: ExampleValidator
        dependentTasks:
        - SchemaUpdater
        - StatisticsGen
        inputs:
          artifacts:
            schema:
              taskOutputArtifact:
                outputArtifactKey: updated_schema
                producerTask: SchemaUpdater
            statistics:
              taskOutputArtifact:
                outputArtifactKey: statistics
                producerTask: StatisticsGen
          parameters:
            exclude_splits:
              runtimeValue:
                constantValue:
                  stringValue: '[]'
        taskInfo:
          name: ExampleValidator
      FeatureEngineeringComponent:
        cachingOptions:
          enableCache: true
        componentRef:
          name: FeatureEngineeringComponent
        dependentTasks:
        - ImportExampleGen
        inputs:
          artifacts:
            examples:
              taskOutputArtifact:
                outputArtifactKey: examples
                producerTask: ImportExampleGen
        taskInfo:
          name: FeatureEngineeringComponent
      HumanEvaluator:
        cachingOptions:
          enableCache: true
        componentRef:
          name: HumanEvaluator
        dependentTasks:
        - Evaluator
        inputs:
          artifacts:
            model_blessing:
              taskOutputArtifact:
                outputArtifactKey: blessing
                producerTask: Evaluator
            model_evaluation:
              taskOutputArtifact:
                outputArtifactKey: evaluation
                producerTask: Evaluator
          parameters:
            human_evaluator_email_id:
              runtimeValue:
                constantValue:
                  stringValue: lightningsword104@gmail.com
            num_retries:
              runtimeValue:
                constantValue:
                  intValue: '3'
            waiting_time:
